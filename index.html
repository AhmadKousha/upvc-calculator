   <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hegmatan Plastic Alvan - UPVC Calculator</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js">
    </script>
    <style>
        /* ===== تنظیمات پایه ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #eef3f8 0%, #dce4ed 100%);
            font-family: 'Arial', 'Tahoma', 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            max-width: 560px;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 36px;
            box-shadow: 0 25px 80px rgba(0, 20, 40, 0.18), 0 8px 32px rgba(0, 0, 0, 0.06);
            padding: 32px 28px 36px;
            border: 1px solid rgba(255, 255, 255, 0.50);
            transition: all 0.3s ease;
        }

        /* ===== هدر ===== */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            padding-bottom: 22px;
            border-bottom: 2px solid rgba(26, 58, 92, 0.10);
        }

        .logo-container {
            width: 80px;
            height: 80px;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(26, 58, 92, 0.30);
            background: linear-gradient(135deg, #1a3a5c 0%, #2a6a8a 50%, #3a7a9a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 30px;
            font-weight: 900;
            color: white;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            font-family: 'Arial', 'Tahoma', sans-serif;
        }

        .logo-container:hover {
            transform: scale(1.05) rotate(-3deg);
            box-shadow: 0 12px 40px rgba(26, 58, 92, 0.40);
        }

        .brand-title {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1.3;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #1a3a5c, #2a7a9a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'Arial', 'Tahoma', sans-serif;
        }

        .brand-subtitle {
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            color: #3a6a8a;
            letter-spacing: 2px;
            margin-top: 2px;
            font-family: 'Arial', 'Tahoma', sans-serif;
        }

        .brand-subtitle span {
            display: inline-block;
            background: rgba(26, 58, 92, 0.06);
            padding: 4px 20px;
            border-radius: 30px;
            font-size: 13px;
            color: #2a5a7a;
            letter-spacing: 1.5px;
            border: 1px solid rgba(26, 58, 92, 0.06);
            font-family: 'Arial', 'Tahoma', sans-serif;
        }

        /* ===== ورودی‌ها ===== */
        .input-card {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 22px;
            padding: 20px 18px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.80);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        .input-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 700;
            color: #1a2a3a;
            margin-bottom: 6px;
            font-family: 'Arial', 'Tahoma', sans-serif;
        }

        .input-group label .badge {
            background: rgba(26, 58, 92, 0.08);
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            color: #1a3a5c;
            letter-spacing: 0.3px;
            font-family: 'Arial', 'Tahoma', sans-serif;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(26, 58, 92, 0.12);
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            color: #0a1a2a;
            background: white;
            transition: all 0.25s ease;
            outline: none;
            direction: ltr;
            text-align: right;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            font-family: 'Arial', 'Tahoma', sans-serif;
        }

        .input-wrapper input:focus {
            border-color: #1a3a5c;
            box-shadow: 0 0 0 4px rgba(26, 58, 92, 0.10), 0 4px 12px rgba(26, 58, 92, 0.06);
            transform: translateY(-1px);
        }

        .input-wrapper input::placeholder {
            color: #aabbc8;
            font-weight: 400;
            font-size: 15px;
        }

        /* ================================================================
           دکمه‌ها
           ================================================================ */
        .calc-btn-wrapper {
            width: 100%;
            margin-bottom: 18px;
        }

        .calc-btn {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 0.5px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
            font-family: 'Arial', 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #1a3a5c 0%, #2a5a7a 40%, #3a7a9a 80%, #4a8aaa 100%);
            color: white;
            box-shadow: 0 6px 25px rgba(26, 58, 92, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.10);
        }

        .calc-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
            transform: scale(0.8);
            pointer-events: none;
        }

        .calc-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.06) 50%, transparent 60%);
            background-size: 200% 200%;
            animation: shineMove 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes shineMove {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .calc-btn:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 12px 35px rgba(26, 58, 92, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.22);
        }

        .calc-btn:hover::before {
            opacity: 1;
            transform: scale(1);
        }

        .calc-btn:active {
            transform: scale(0.96);
            box-shadow: 0 4px 15px rgba(26, 58, 92, 0.20);
        }

        .calc-btn .btn-icon {
            font-size: 24px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .calc-btn:hover .btn-icon {
            transform: rotate(10deg) scale(1.1);
        }

        .calc-btn.loading {
            pointer-events: none;
            opacity: 0.85;
        }

        .calc-btn.loading .btn-text {
            visibility: hidden;
        }

        .calc-btn.loading .btn-icon {
            animation: spin 1s linear infinite;
        }

        .calc-btn .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            position: absolute;
        }

        .calc-btn.loading .spinner {
            display: block;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== ردیف دکمه‌های پایین (متن و عکس) ===== */
        .btn-group-bottom {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn-group-bottom button {
            position: relative;
            overflow: hidden;
            padding: 14px 20px;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
            flex: 1;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
            font-family: 'Arial', 'Tahoma', sans-serif;
        }

        .share-btn {
            background: linear-gradient(135deg, #0d6e3a 0%, #1a9a5a 50%, #2ab87a 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(15, 123, 58, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .share-btn::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #2ab87a, #1a9a5a, #0d6e3a);
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
            filter: blur(8px);
        }

        .share-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 28px rgba(15, 123, 58, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .share-btn:hover::after {
            opacity: 0.5;
        }

        .share-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 12px rgba(15, 123, 58, 0.15);
        }

        .share-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: 0 4px 12px rgba(15, 123, 58, 0.08) !important;
            filter: grayscale(0.3);
        }

        .image-btn {
            background: linear-gradient(135deg, #6a3a8a 0%, #8a5aaa 50%, #aa7aca 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(106, 58, 138, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .image-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 18px;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.08) 50%, transparent 60%);
            background-size: 200% 200%;
            animation: shineMove 3s ease-in-out infinite;
            pointer-events: none;
        }

        .image-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 28px rgba(106, 58, 138, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .image-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 12px rgba(106, 58, 138, 0.15);
        }

        .image-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: 0 4px 12px rgba(106, 58, 138, 0.08) !important;
            filter: grayscale(0.3);
        }

        .image-btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .image-btn.loading .spinner-small {
            display: block;
        }

        .image-btn.loading .btn-text {
            visibility: hidden;
        }

        .image-btn .spinner-small {
            display: none;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            position: absolute;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleAnimation 0.6s ease-out forwards;
            pointer-events: none;
        }

        @keyframes rippleAnimation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* ================================================================
           نتایج - فاصله بیشتر
           ================================================================ */
        .result-section {
            display: none;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 8px;
        }

        .result-section.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .result-header h2 {
            font-size: 17px;
            color: #0a1a2a;
            font-weight: 800;
            font-family: 'Arial', 'Tahoma', sans-serif;
        }

        .result-header .profit-badge {
            font-size: 14px;
            color: #0a7a3a;
            background: rgba(10, 122, 58, 0.12);
            padding: 5px 18px;
            border-radius: 30px;
            font-weight: 800;
            border: 1px solid rgba(10, 122, 58, 0.15);
            font-family: 'Arial', 'Tahoma', sans-serif;
        }

        .result-header .count {
            font-size: 13px;
            color: #4a6a7a;
            background: rgba(26, 58, 92, 0.08);
            padding: 5px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-family: 'Arial', 'Tahoma', sans-serif;
        }

        .result-header .calc-date {
            font-size: 12px;
            color: #6a8a9a;
            background: rgba(26, 58, 92, 0.05);
            padding: 5px 14px;
            border-radius: 30px;
            font-weight: 600;
            font-family: 'Arial', 'Tahoma', sans-serif;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 16px;
            border: 2px solid rgba(26, 58, 92, 0.15);
            border-radius: 30px;
            background: white;
            font-size: 13px;
            font-weight: 700;
            color: #1a3a5c;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Arial', 'Tahoma', sans-serif;
        }

        .filter-btn.active {
            background: #1a3a5c;
            color: white;
            border-color: #1a3a5c;
            box-shadow: 0 4px 15px rgba(26, 58, 92, 0.20);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 58, 92, 0.12);
        }

        .filter-btn:active {
            transform: scale(0.95);
        }

        /* ===== منطقه مخصوص عکس ===== */
        #capture-area {
            padding: 16px;
            background: #ffffff;
            border-radius: 20px;
            font-family: 'Arial', 'Tahoma', sans-serif !important;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid rgba(26, 58, 92, 0.06);
            background: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 420px;
            font-family: 'Arial', 'Tahoma', sans-serif !important;
        }

        thead {
            background: linear-gradient(135deg, #1a3a5c, #2a6a8a, #3a7a9a);
            color: white;
        }

        thead th {
            padding: 14px 8px;
            text-align: center;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-right: 1px solid rgba(255, 255, 255, 0.10);
            font-family: 'Arial', 'Tahoma', sans-serif !important;
        }

        thead th:last-child {
            border-right: none;
        }

        tbody tr {
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:nth-child(even) {
            background: #f0f6fc;
        }

        tbody tr:nth-child(odd) {
            background: #ffffff;
        }

        tbody tr:hover {
            background: #dce8f5 !important;
            transform: scale(1.01);
            box-shadow: 0 2px 12px rgba(26, 58, 92, 0.08);
            cursor: default;
        }

        tbody td {
            padding: 12px 8px;
            text-align: center;
            font-weight: 500;
            color: #1a2a3a;
            font-size: 14px;
            border-right: 1px solid rgba(0, 0, 0, 0.03);
            font-family: 'Arial', 'Tahoma', sans-serif !important;
        }

        tbody td:last-child {
            border-right: none;
        }

        tbody td:last-child {
            font-weight: 800;
            color: #0a7a3a;
            font-size: 16px;
            white-space: nowrap;
            background: rgba(10, 122, 58, 0.04);
            border-radius: 0 12px 12px 0;
        }

        tbody td:nth-last-child(2) {
            font-weight: 600;
            color: #7a4a1a;
            font-size: 14px;
            white-space: nowrap;
        }

        /* ================================================================
           تگ‌های درجه با نوار سیاه
           ================================================================ */
        .grade-tag {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
            letter-spacing: 0.2px;
            border: 2px solid #222;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: all 0.2s ease;
            font-family: 'Arial', 'Tahoma', sans-serif !important;
        }

        .grade-tag:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .grade-1 {
            background: linear-gradient(135deg, #d4e2f7, #b8cce8);
            color: #1a3a5c;
        }

        .grade-2 {
            background: linear-gradient(135deg, #d4f0e0, #a8dcc4);
            color: #0a5a2a;
        }

        .grade-3 {
            background: linear-gradient(135deg, #f7e8d4, #f0d4b0);
            color: #7a4a1a;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a2a3a;
            color: white;
            padding: 12px 28px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.20);
            z-index: 999;
            font-family: 'Arial', 'Tahoma', sans-serif;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ================================================================
           فوتر
           ================================================================ */
        .footer {
            margin-top: 24px;
            padding: 16px 20px;
            border-radius: 16px;
            background: linear-gradient(135deg, #1a3a5c 0%, #2a6a8a 50%, #3a7a9a 100%);
            text-align: center;
            box-shadow: 0 6px 25px rgba(26, 58, 92, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
        }

        .footer:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 35px rgba(26, 58, 92, 0.30);
        }

        .footer .company-name {
            font-size: 18px;
            font-weight: 900;
            color: white;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            font-family: 'Arial', 'Tahoma', sans-serif;
        }

        /* ================================================================
           ریسپانسیو
           ================================================================ */
        @media (max-width: 500px) {
            body {
                padding: 12px;
            }

            .app-container {
                padding: 22px 16px 26px;
                border-radius: 28px;
            }

            .logo-container {
                width: 68px;
                height: 68px;
                border-radius: 18px;
                margin-bottom: 12px;
            }

            .logo-text {
                font-size: 26px;
            }

            .brand-title {
                font-size: 22px;
            }

            .brand-subtitle {
                font-size: 14px;
            }

            .brand-subtitle span {
                font-size: 12px;
                padding: 4px 16px;
            }

            .header {
                margin-bottom: 22px;
                padding-bottom: 18px;
            }

            .input-card {
                padding: 16px 14px;
                border-radius: 18px;
                margin-bottom: 18px;
            }

            .input-group {
                margin-bottom: 14px;
            }

            .input-group label {
                font-size: 14px;
                margin-bottom: 5px;
            }

<body>

    <div class="app-container" id="app">

        <!-- ===== هدر ===== -->
        <div class="header">
            <div class="logo-container">
                <span class="logo-text">HPA</span>
            </div>
            <div class="brand-title">Hegmatan Plastic Alvan</div>
            <div class="brand-subtitle">
                <span>UPVC Calculator</span>
            </div>
        </div>

        <!-- ===== ورودی‌ها ===== -->
        <div class="input-card">
            <div class="input-group">
                <label>
                    <span>قیمت هر کیلو <span style="color:#1a3a5c;font-weight:800;">درجه یک</span></span>
                    <span class="badge">نیمه‌قوی</span>
                </label>
                <div class="input-wrapper">
                    <input type="number" id="price1" placeholder="مثلاً 25000" value="25000" step="100">
                </div>
            </div>

            <div class="input-group">
                <label>
                    <span>قیمت هر کیلو <span style="color:#0a6a3a;font-weight:800;">استاندارد</span></span>
                    <span class="badge">نیمه‌قوی</span>
                </label>
                <div class="input-wrapper">
                    <input type="number" id="price2" placeholder="مثلاً 22000" value="22000" step="100">
                </div>
            </div>

            <div class="input-group">
                <label>
                    <span>قیمت هر کیلو <span style="color:#7a4a1a;font-weight:800;">معمولی</span></span>
                    <span class="badge">ساده</span>
                </label>
                <div class="input-wrapper">
                    <input type="number" id="price3" placeholder="مثلاً 18000" value="18000" step="100">
                </div>
            </div>

            <div class="input-group" style="margin-bottom:0;">
                <label>
                    <span>درصد سود مورد نظر</span>
                    <span class="badge">سود خالص</span>
                </label>
                <div class="input-wrapper">
                    <input type="number" id="profit" placeholder="مثلاً 30" value="30" step="1" min="0">
                </div>

        </div>

        <!-- ============================================================
             دکمه‌ها
             ============================================================ -->

        <!-- ===== دکمه محاسبه (کوچک‌تر) ===== -->
        <div class="calc-btn-wrapper">
            <button class="calc-btn" id="calcBtn">
                <span class="spinner"></span>
                <span class="btn-icon">🧮</span>
                <span class="btn-text">محاسبه قیمت</span>
            </button>
        </div>

        <!-- ===== دو دکمه پایین (متن و عکس) ===== -->
        <div class="btn-group-bottom">
            <button class="share-btn" id="shareBtn" disabled>
                <span class="btn-text">📋 متن</span>
            </button>
            <button class="image-btn" id="imageBtn" disabled>
                <span class="spinner-small"></span>
                <span class="btn-text">🖼️ عکس</span>
            </button>
        </div>

        <!-- ============================================================
             نتایج
             ============================================================ -->
        <div class="result-section" id="resultSection">
            <div class="result-header">
                <h2>لیست قیمت‌های فروش</h2>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <span class="profit-badge" id="profitDisplay">سود ۳۰٪</span>
                    <span class="count" id="rowCount">۰ ردیف</span>
                    <span class="calc-date" id="calcDate">-</span>
                </div>
            </div>

            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">همه</button>
                <button class="filter-btn" data-filter="درجه یک">درجه یک</button>
                <button class="filter-btn" data-filter="استاندارد">استاندارد</button>
                <button class="filter-btn" data-filter="معمولی">معمولی</button>
            </div>

            <!-- منطقه مخصوص عکس -->
            <div id="capture-area">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>درجه</th>
                                <th>سایز</th>
                                <th>وزن (کیلو)</th>
                                <th>قیمت تمام شده</th>
                                <th>قیمت فروش</th>
                            </tr>
                        </thead>
                        <tbody id="resultBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ===== فوتر ===== -->
        <div class="footer">
            <span class="company-name">شرکت هگمتان پلاستیک الوند</span>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast">متن کپی شد!</div>

    <script>
        // ============================================================
        //  داده‌های ثابت
        // ============================================================
        const PRODUCTS = [
            { grade: 'درجه یک', gradeClass: 'grade-1', size: 63, weight: 5.5 },
            { grade: 'درجه یک', gradeClass: 'grade-1', size: 90, weight: 7.3 },
            { grade: 'درجه یک', gradeClass: 'grade-1', size: 110, weight: 9.5 },
            { grade: 'درجه یک', gradeClass: 'grade-1', size: 125, weight: 12.2 },
            { grade: 'درجه یک', gradeClass: 'grade-1', size: 160, weight: 19.6 },
            { grade: 'درجه یک', gradeClass: 'grade-1', size: 200, weight: 28.5 },
            { grade: 'استاندارد', gradeClass: 'grade-2', size: 63, weight: 4.8 },
            { grade: 'استاندارد', gradeClass: 'grade-2', size: 90, weight: 6.5 },
            { grade: 'استاندارد', gradeClass: 'grade-2', size: 110, weight: 9.1 },
            { grade: 'استاندارد', gradeClass: 'grade-2', size: 125, weight: 11.8 },
            { grade: 'استاندارد', gradeClass: 'grade-2', size: 160, weight: 19.8 },
            { grade: 'استاندارد', gradeClass: 'grade-2', size: 200, weight: 28.8 },
            { grade: 'معمولی', gradeClass: 'grade-3', size: 63, weight: 3.5 },
            { grade: 'معمولی', gradeClass: 'grade-3', size: 90, weight: 4.4 },
            { grade: 'معمولی', gradeClass: 'grade-3', size: 110, weight: 6.4 },
            { grade: 'معمولی', gradeClass: 'grade-3', size: 125, weight: 8.2 }
        ];

        // ============================================================
        //  متغیرهای سراسری
        // ============================================================
        let lastPrices = {
            price1: 0,
            price2: 0,
            price3: 0,
            profit: 0,
            rows: [],
            date: ''
        };

        let currentFilter = 'all';
        let allRowsData = [];
        let isCalculating = false;
        let isCapturing = false;

        // ============================================================
        //  توابع
        // ============================================================
        function numberWithCommas(x) {
            return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function getCurrentDate() {
            const now = new Date();
            return now.toLocaleDateString('fa-IR') + ' ' + now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
        }

        function getDateForFilename() {
            const now = new Date();
            return now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                String(now.getDate()).padStart(2, '0');
        }

        function createRipple(event, button) {
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            const rect = button.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size / 2;
            const y = event.clientY - rect.top - size / 2;
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            button.appendChild(ripple);
            setTimeout(() => {
                ripple.remove();
            }, 700);
        }

        // ===== محاسبه =====
        function calculate() {
            if (isCalculating) return;
            const btn = document.getElementById('calcBtn');

            isCalculating = true;
            btn.classList.add('loading');

            setTimeout(() => {
                performCalculation();
                btn.classList.remove('loading');
                isCalculating = false;
            }, 600);
        }

        function performCalculation() {
            const price1 = parseFloat(document.getElementById('price1').value);
            const price2 = parseFloat(document.getElementById('price2').value);
            const price3 = parseFloat(document.getElementById('price3').value);
            const profitPercent = parseFloat(document.getElementById('profit').value);

            if (isNaN(price1) || price1 < 0) { alert('لطفاً قیمت درجه یک را وارد کنید.'); return; }
            if (isNaN(price2) || price2 < 0) { alert('لطفاً قیمت استاندارد را وارد کنید.'); return; }
            if (isNaN(price3) || price3 < 0) { alert('لطفاً قیمت معمولی را وارد کنید.'); return; }
            if (isNaN(profitPercent) || profitPercent < 0) { alert('لطفاً درصد سود را وارد کنید.'); return; }

            const priceMap = {
                'درجه یک': price1,
                'استاندارد': price2,
                'معمولی': price3
            };

            const profitFactor = 1 + (profitPercent / 100);
            const tbody = document.getElementById('resultBody');
            const rowCount = document.getElementById('rowCount');
            const profitDisplay = document.getElementById('profitDisplay');
            const calcDate = document.getElementById('calcDate');

            const rowData = [];
            const date = getCurrentDate();

            PRODUCTS.forEach(p => {
                const costPerKg = priceMap[p.grade];
                if (costPerKg === undefined) return;

                const costPerUnit = p.weight * costPerKg;
                const finalPrice = costPerUnit * profitFactor;

                const roundedCost = Math.round(costPerUnit);
                const roundedFinal = Math.round(finalPrice);

                rowData.push({
                    grade: p.grade,
                    gradeClass: p.gradeClass,
                    size: p.size,
                    weight: p.weight,
                    costPrice: roundedCost,
                    sellPrice: roundedFinal
                });
            });

            allRowsData = rowData;
            lastPrices = {
                price1,
                price2,
                price3,
                profit: profitPercent,
                rows: rowData,
                date: date
            };

            applyFilter(currentFilter);

            rowCount.textContent = rowData.length + ' ردیف';
            profitDisplay.textContent = `سود ${profitPercent}٪`;
            calcDate.textContent = date;

            const section = document.getElementById('resultSection');
            section.classList.add('show');
            document.getElementById('shareBtn').disabled = false;
            document.getElementById('imageBtn').disabled = false;

            setTimeout(() => {
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 150);

            showToast('محاسبه با موفقیت انجام شد!');
        }

        function applyFilter(filter) {
            currentFilter = filter;
            const tbody = document.getElementById('resultBody');

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });

            let filteredRows = allRowsData;
            if (filter !== 'all') {
                filteredRows = allRowsData.filter(r => r.grade === filter);
            }

            let rows = '';
            filteredRows.forEach(r => {
                rows += `
                        <tr>
                            <td><span class="grade-tag ${r.gradeClass}">${r.grade}</span></td>
                            <td>${r.size}</td>
                            <td>${r.weight.toFixed(1)}</td>
                            <td>${numberWithCommas(r.costPrice)}</td>
                            <td>${numberWithCommas(r.sellPrice)}</td>
                        </tr>
                    `;
            });

            tbody.innerHTML = rows || '<tr><td colspan="5" style="padding:20px;color:#7a8a9a;">هیچ محصولی یافت نشد</td></tr>';
        }

        // ============================================================
        //  تبدیل به عکس با رفع کامل مشکل فونت
        // ============================================================
        function captureAsImage() {
            if (isCapturing) return;
            if (allRowsData.length === 0) {
                alert('لطفاً ابتدا محاسبه را انجام دهید.');
                return;
            }

            const btn = document.getElementById('imageBtn');
            isCapturing = true;
            btn.classList.add('loading');

            const captureArea = document.getElementById('capture-area');

            // تنظیم فونت اجباری برای همه المان‌ها قبل از تبدیل
            const allElements = captureArea.querySelectorAll('*');
            allElements.forEach(el => {
                el.style.fontFamily = "'Arial', 'Tahoma', sans-serif";
            });

            // تاخیر برای اعمال فونت
            setTimeout(() => {
                html2canvas(captureArea, {
                    scale: 2.5,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff',
                    logging: false,
                    width: captureArea.scrollWidth,
                    height: captureArea.scrollHeight,
                    windowWidth: captureArea.scrollWidth,
                    windowHeight: captureArea.scrollHeight,
                    onclone: function(clonedDoc, element) {
                        // تنظیم فونت برای تمام المان‌های کلون شده
                        const allEls = element.querySelectorAll('*');
                        allEls.forEach(el => {
                            el.style.fontFamily = "'Arial', 'Tahoma', sans-serif";
                        });

                        // تنظیم فونت برای تگ‌های درجه
                        const gradeTags = element.querySelectorAll('.grade-tag');
                        gradeTags.forEach(el => {
                            el.style.fontFamily = "'Arial', 'Tahoma', sans-serif";
                            el.style.fontWeight = '800';
                        });

                        // تنظیم فونت برای هدر جدول
                        const thElements = element.querySelectorAll('th');
                        thElements.forEach(el => {
                            el.style.fontFamily = "'Arial', 'Tahoma', sans-serif";
                            el.style.fontWeight = '700';
                        });

                        // تنظیم فونت برای سلول‌های جدول
                        const tdElements = element.querySelectorAll('td');
                        tdElements.forEach(el => {
                            el.style.fontFamily = "'Arial', 'Tahoma', sans-serif";
                        });

                        // تنظیم فونت برای کل جدول
                        const tables = element.querySelectorAll('table');
                        tables.forEach(el => {
                            el.style.fontFamily = "'Arial', 'Tahoma', sans-serif";
                        });
                    }
                }).then(canvas => {
                    btn.classList.remove('loading');
                    isCapturing = false;

                    const link = document.createElement('a');
                    link.download = `لیست_قیمت_UPVC_${getDateForFilename()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    showToast('عکس با موفقیت ذخیره شد!');

                    if (navigator.share) {
                        canvas.toBlob(function(blob) {
                            const file = new File([blob], `لیست_قیمت_UPVC_${getDateForFilename()}.png`, { type: 'image/png' });
                            navigator.share({
                                title: 'لیست قیمت لوله UPVC',
                                files: [file]
                            }).catch(() => {});
                        });
                    }

                }).catch(error => {
                    console.error('خطا در تبدیل به عکس:', error);
                    btn.classList.remove('loading');
                    isCapturing = false;
                    showToast('خطا در تبدیل به عکس');
                });
            }, 400);
        }

        // ============================================================
        //  اشتراک‌گذاری متن
        // ============================================================
        function generateShareText() {
            const p = lastPrices;
            if (p.rows.length === 0) return '';

            let text = '';
            text += 'لیست قیمت فروش لوله UPVC\n';
            text += '═══════════════════════════════\n';
            text += `${p.date}\n`;
            text += `قیمت هر کیلو درجه یک: ${numberWithCommas(p.price1)} تومان\n`;
            text += `قیمت هر کیلو استاندارد: ${numberWithCommas(p.price2)} تومان\n`;
            text += `قیمت هر کیلو معمولی: ${numberWithCommas(p.price3)} تومان\n`;
            text += `درصد سود: ${p.profit}٪\n`;
            text += '═══════════════════════════════\n\n';
            text += '┌──────────┬────────┬────────────┬────────────┐\n';
            text += '│   درجه   │  سایز  │ تمام شده  │ قیمت فروش │\n';
            text += '├──────────┼────────┼────────────┼────────────┤\n';

            p.rows.forEach(r => {
                const gradeShort = r.grade === 'درجه یک' ? 'درجه یک' :
                    r.grade === 'استاندارد' ? 'استاندارد' : 'معمولی';
                text +=
                    `│ ${gradeShort.padEnd(8)} │ ${String(r.size).padEnd(6)} │ ${String(numberWithCommas(r.costPrice)).padEnd(10)} │ ${String(numberWithCommas(r.sellPrice)).padEnd(10)} │\n`;
            });

            text += '└──────────┴────────┴────────────┴────────────┘\n';
            text += '═══════════════════════════════\n';
            text += 'لیست قیمت‌ها با موفقیت محاسبه شد.\n';
            text += 'شرکت هگمتان پلاستیک الوند';

            return text;
        }

        function shareResult() {
            if (lastPrices.rows.length === 0) {
                alert('لطفاً ابتدا قیمت‌ها را محاسبه کنید.');
                return;
            }

            const text = generateShareText();

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('متن در کلیپ‌بورد کپی شد!');
                }).catch(() => {
                    copyFallback(text);
                });
            } else {
                copyFallback(text);
            }

            if (navigator.share) {
                navigator.share({
                    title: 'لیست قیمت لوله UPVC',
                    text: text
                }).catch(() => {});
            }
        }

        function copyFallback(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('متن در کلیپ‌بورد کپی شد!');
            } catch (err) {
                alert('لطفاً متن زیر را کپی کنید:\n\n' + text);
            }
            document.body.removeChild(textarea);
        }

        // ============================================================
        //  رویدادها
        // ============================================================
        document.querySelectorAll('.calc-btn, .btn-group-bottom button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                createRipple(e, this);
            });
        });

        document.getElementById('calcBtn').addEventListener('click', calculate);
        document.getElementById('shareBtn').addEventListener('click', shareResult);
        document.getElementById('imageBtn').addEventListener('click', captureAsImage);

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                if (allRowsData.length > 0) {
                    applyFilter(this.dataset.filter);
                    createRipple(e, this);
                }
            });
        });

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    calculate();
                }
            });
        });

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(calculate, 400);
        });
    </script>

</body>
