<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hegmatan UPVC Calculator</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0B3D91">

<style>

body{
    font-family:tahoma;
    margin:0;
    background:#f4f6f9;
}

.header{
    background:#0B3D91;
    color:white;
    text-align:center;
    padding:20px;
}

.logo{
    width:100px;
    height:100px;
    border-radius:50%;
    background:white;
    margin:auto;
    overflow:hidden;
}

.logo img{
    width:100%;
}

.container{
    padding:15px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 2px 5px rgba(0,0,0,0.15);
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#0B3D91;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th{
    background:#0B3D91;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

.footer{
    text-align:center;
    color:#666;
    margin-top:20px;
}

</style>
</head>

<body>

<div class="header">

<div class="logo">
<img src="logo.png">
</div>

<h2>Hegmatan Plastic</h2>
<p>UPVC Price Calculator</p>

</div>

<div class="container">

<div class="card">

<label>قیمت هر کیلو درجه 1</label>
<input id="p1" type="number">

<label>قیمت هر کیلو درجه 2</label>
<input id="p2" type="number">

<label>قیمت هر کیلو درجه 3</label>
<input id="p3" type="number">

<button onclick="calculate()">محاسبه قیمت ها</button>

</div>

<div class="card">

<table>

<thead>
<tr>
<th>سایز</th>
<th>درجه</th>
<th>قیمت شاخه</th>
<th>قیمت هر متر</th>
</tr>
</thead>

<tbody id="result"></tbody>

</table>

</div>

</div>

<div class="footer">
Hegmatan Plastic © 2025
</div>

<script>

const pipes = [

{size:63,g1:5.5,g2:4.8,g3:3.5},
{size:90,g1:7.3,g2:6.5,g3:4.4},
{size:110,g1:9.5,g2:9.1,g3:6.4},
{size:125,g1:12.2,g2:11.8,g3:8.2},
{size:160,g1:19.6,g2:19.8,g3:null},
{size:200,g1:28.5,g2:28.8,g3:null}

];

function money(num){
    return Number(num).toLocaleString('en-US');
}

function addRow(size,grade,weight,price){

    if(weight===null){

        return `
        <tr>
        <td>${size}</td>
        <td>${grade}</td>
        <td colspan="2">تولید نمی شود</td>
        </tr>`;
    }

    let branch=weight*price;
    let meter=branch/6;

    return `
    <tr>
    <td>${size}</td>
    <td>${grade}</td>
    <td>${money(branch)}</td>
    <td>${money(meter)}</td>
    </tr>`;
}

function calculate(){

    let p1=Number(document.getElementById("p1").value);
    let p2=Number(document.getElementById("p2").value);
    let p3=Number(document.getElementById("p3").value);

    localStorage.setItem("p1",p1);
    localStorage.setItem("p2",p2);
    localStorage.setItem("p3",p3);

    let html="";

    pipes.forEach(p=>{

        html += addRow(p.size,"درجه 1",p.g1,p1);
        html += addRow(p.size,"درجه 2",p.g2,p2);
        html += addRow(p.size,"درجه 3",p.g3,p3);

    });

    document.getElementById("result").innerHTML=html;
}

window.onload=function(){

document.getElementById("p1").value=
localStorage.getItem("p1") || "";

document.getElementById("p2").value=
localStorage.getItem("p2") || "";

document.getElementById("p3").value=
localStorage.getItem("p3") || "";

}

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js');
  });
}
</script>
</body>
</html>
