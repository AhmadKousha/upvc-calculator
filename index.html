<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a3a5c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="UPVC Calc">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Hegmatan Plastic Alvan - UPVC Calculator</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js">
    </script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        /* ===== تنظیمات پایه با فونت رسمی ===== */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #eef3f8 0%, #dce4ed 100%);
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', 'Tahoma', 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* افکت پس‌زمینه متحرک */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 40%, rgba(26, 58, 92, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(42, 106, 138, 0.03) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes bgFloat {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(5%, 5%) rotate(5deg);
            }
        }

        .app-container {
            max-width: 560px;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 36px;
            box-shadow: 0 25px 80px rgba(0, 20, 40, 0.18), 0 8px 32px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            padding: 32px 28px 36px;
            border: 1px solid rgba(255, 255, 255, 0.50);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            animation: containerIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== هدر ===== */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            padding-bottom: 22px;
            border-bottom: 2px solid rgba(26, 58, 92, 0.10);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 25%;
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #1a3a5c, transparent);
            border-radius: 2px;
        }

        .header-top {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }

        .logo-container {
            width: 80px;
            height: 80px;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(26, 58, 92, 0.30), inset 0 2px 0 rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, #1a3a5c 0%, #2a6a8a 50%, #3a7a9a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            position: relative;
        }

        .logo-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.15) 50%, transparent 60%);
            background-size: 200% 200%;
            animation: shineLogo 3s ease-in-out infinite;
        }

        @keyframes shineLogo {
            0% {
                background-position: -200% center;
            }
            100% {
                background-position: 200% center;
            }
        }

        .logo-text {
            font-size: 30px;
            font-weight: 900;
            color: white;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', sans-serif;
            position: relative;
            z-index: 1;
        }

        .logo-container:hover {
            transform: scale(1.08) rotate(-3deg);
            box-shadow: 0 12px 40px rgba(26, 58, 92, 0.40);
        }

        .brand-title {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1.3;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #1a3a5c, #2a7a9a, #4a8aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', sans-serif;
            text-shadow: 0 2px 20px rgba(26, 58, 92, 0.1);
        }

        .brand-subtitle {
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            color: #3a6a8a;
            letter-spacing: 2px;
            margin-top: 2px;
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', sans-serif;
        }

        .brand-subtitle span {
            display: inline-block;
            background: rgba(26, 58, 92, 0.06);
            padding: 4px 20px;
            border-radius: 30px;
            font-size: 13px;
            color: #2a5a7a;
            letter-spacing: 1.5px;
            border: 1px solid rgba(26, 58, 92, 0.06);
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', sans-serif;
        }

        /* ===== ورودی‌ها ===== */
        .input-card {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 22px;
            padding: 20px 18px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.80);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
        }

        .input-card:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        .input-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 700;
            color: #1a2a3a;
            margin-bottom: 6px;
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', sans-serif;
        }

        .input-group label .badge {
            background: rgba(26, 58, 92, 0.08);
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            color: #1a3a5c;
            letter-spacing: 0.3px;
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', sans-serif;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(26, 58, 92, 0.12);
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            color: #0a1a2a;
            background: white;
            transition: all 0.25s ease;
            outline: none;
            direction: ltr;
            text-align: right;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', sans-serif;
        }

        .input-wrapper input:focus {
            border-color: #1a3a5c;
            box-shadow: 0 0 0 4px rgba(26, 58, 92, 0.10), 0 4px 12px rgba(26, 58, 92, 0.06);
            transform: translateY(-1px);
        }

        .input-wrapper input::placeholder {
            color: #aabbc8;
            font-weight: 400;
            font-size: 15px;
        }

        /* ============================================================
           استایل عمومی دکمه‌ها با حاشیه مشکی نازک
           ============================================================ */
        .calc-btn,
        .settings-btn,
        .share-btn,
        .image-btn,
        .filter-btn,
        .modal-actions button,
        .modal-add-row .add-btn {
            border: 2px solid rgba(0, 0, 0, 0.6) !important;
            position: relative;
            overflow: hidden;
        }

        .calc-btn:hover,
        .settings-btn:hover,
        .share-btn:hover,
        .image-btn:hover,
        .filter-btn:hover,
        .modal-actions button:hover,
        .modal-add-row .add-btn:hover {
            border-color: #000000 !important;
        }

        /* ============================================================
           دکمه محاسبه قیمت - رنگ آبی-سبز حرفه‌ای
           ============================================================ */
        .calc-btn-wrapper {
            width: 100%;
            margin-bottom: 12px;
        }

        .calc-btn {
            width: 100%;
            padding: 16px 24px;
            border: 2px solid rgba(0, 0, 0, 0.6) !important;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 0.5px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', 'Tahoma', sans-serif !important;
            /* رنگ هماهنگ با هویت بصری برنامه (همون آبی سرمه‌ای لوگو و هدر جدول) */
            background: linear-gradient(135deg, #1a3a5c 0%, #2a6a8a 50%, #3a7a9a 100%);
            background-size: 200% 200%;
            color: #ffffff;
            box-shadow: 0 6px 25px rgba(26, 58, 92, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.15);
            animation: blueShine 4s ease-in-out infinite;
        }

        @keyframes blueShine {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .calc-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
            transform: scale(0.8);
            pointer-events: none;
        }

        .calc-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.06) 50%, transparent 60%);
            background-size: 200% 200%;
            animation: shineMove 3s ease-in-out infinite;
            pointer-events: none;
        }

        .calc-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(26, 58, 92, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-color: #000000 !important;
        }

        .calc-btn:hover::before {
            opacity: 1;
            transform: scale(1);
        }

        .calc-btn:active {
            transform: scale(0.96);
            box-shadow: 0 4px 15px rgba(26, 58, 92, 0.20);
        }

        .calc-btn .btn-icon {
            font-size: 24px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .calc-btn:hover .btn-icon {
            transform: rotate(15deg) scale(1.1);
        }

        .calc-btn.loading {
            pointer-events: none;
            opacity: 0.85;
        }

        .calc-btn.loading .btn-text {
            visibility: hidden;
        }

        .calc-btn.loading .btn-icon {
            animation: spin 1s linear infinite;
        }

        .calc-btn .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            position: absolute;
        }

        .calc-btn.loading .spinner {
            display: block;
        }

        /* ============================================================
           دکمه تنظیمات - رنگ سرمه‌ای-طلایی شیک
           ============================================================ */
        .settings-wrapper-middle {
            width: 100%;
            margin-bottom: 14px;
        }

        .settings-btn {
            background: linear-gradient(135deg, #2c3e50 0%, #4a6a7a 50%, #2c3e50 100%);
            background-size: 200% 200%;
            border: 2px solid rgba(0, 0, 0, 0.6) !important;
            border-radius: 16px;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 25px rgba(44, 62, 80, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            letter-spacing: 0.5px;
            justify-content: center;
            position: relative;
            overflow: hidden;
            width: 100%;
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', 'Tahoma', sans-serif !important;
            animation: navyShine 5s ease-in-out infinite;
        }

        @keyframes navyShine {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .settings-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
            transform: scale(0.8);
            pointer-events: none;
        }

        .settings-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 215, 0, 0.05) 50%, transparent 60%);
            background-size: 200% 200%;
            animation: shineMove 4s ease-in-out infinite;
            pointer-events: none;
        }

        .settings-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 40px rgba(44, 62, 80, 0.40), inset 0 1px 0 rgba(255, 215, 0, 0.15);
            border-color: #000000 !important;
        }

        .settings-btn:hover::before {
            opacity: 1;
            transform: scale(1);
        }

        .settings-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 15px rgba(44, 62, 80, 0.15);
        }

        .settings-btn .icon {
            font-size: 22px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .settings-btn:hover .icon {
            transform: rotate(60deg) scale(1.1);
        }

        /* ===== ردیف دکمه‌های پایین ===== */
        .btn-group-bottom {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn-group-bottom button {
            padding: 14px 20px;
            border: 2px solid rgba(0, 0, 0, 0.6) !important;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
            flex: 1;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', 'Tahoma', sans-serif !important;
        }

        .share-btn {
            background: linear-gradient(135deg, #0d6e3a 0%, #1a9a5a 50%, #0d6e3a 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(15, 123, 58, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .share-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 28px rgba(15, 123, 58, 0.35);
            border-color: #000000 !important;
        }

        .share-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 12px rgba(15, 123, 58, 0.15);
        }

        .share-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .image-btn {
            background: linear-gradient(135deg, #6a3a8a 0%, #8a5aaa 50%, #6a3a8a 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(106, 58, 138, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .image-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 18px;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.08) 50%, transparent 60%);
            background-size: 200% 200%;
            animation: shineMove 3s ease-in-out infinite;
            pointer-events: none;
        }

        .image-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 28px rgba(106, 58, 138, 0.35);
            border-color: #000000 !important;
        }

        .image-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 12px rgba(106, 58, 138, 0.15);
        }

        .image-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .image-btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .image-btn.loading .spinner-small {
            display: block;
        }

        .image-btn.loading .btn-text {
            visibility: hidden;
        }

        .image-btn .spinner-small {
            display: none;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            position: absolute;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleAnimation 0.6s ease-out forwards;
            pointer-events: none;
        }

        @keyframes rippleAnimation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes shineMove {
            0% {
                background-position: -200% center;
            }
            100% {
                background-position: 200% center;
            }
        }

        /* ===== فیلتر دکمه‌ها ===== */
        .filter-btn {
            padding: 6px 16px;
            border: 2px solid rgba(0, 0, 0, 0.6) !important;
            border-radius: 30px;
            background: white;
            font-size: 13px;
            font-weight: 700;
            color: #1a3a5c;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', 'Tahoma', sans-serif !important;
            flex: 0 1 auto;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #1a3a5c, #2a6a8a);
            color: white;
            border-color: #000000 !important;
            box-shadow: 0 4px 15px rgba(26, 58, 92, 0.20);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 58, 92, 0.12);
            border-color: #000000 !important;
        }

        .filter-btn:active {
            transform: scale(0.95);
        }

        /* ===== نتایج ===== */
        .result-section {
            display: none;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 8px;
        }

        .result-section.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .result-header h2 {
            font-size: 17px;
            color: #0a1a2a;
            font-weight: 800;
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', 'Tahoma', sans-serif;
        }

        .result-header .calc-date {
            font-size: 13px;
            color: #4a6a7a;
            background: rgba(26, 58, 92, 0.08);
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', 'Tahoma', sans-serif;
            border: 1px solid rgba(26, 58, 92, 0.08);
        }

        .filter-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        /* ===== منطقه مخصوص عکس با جدول زیبا ===== */
        #capture-area {
            padding: 20px;
            background: #ffffff;
            border-radius: 20px;
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', 'Tahoma', sans-serif !important;
            direction: rtl;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            width: 100%;
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid rgba(26, 58, 92, 0.08);
            background: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            -webkit-overflow-scrolling: touch;
            transition: all 0.3s ease;
            width: 100%;
        }

        .table-wrapper:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 14px;
            min-width: 420px;
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', 'Tahoma', sans-serif !important;
            direction: rtl;
            border-radius: 20px;
            overflow: hidden;
        }

        /* عرض ثابت هر ستون تا جدول همیشه داخل عرض صفحه جا شود
           و در موبایل نیازی به اسکرول افقی برای دیدن ستون قیمت فروش نباشد */
        thead th:nth-child(1) { width: 22%; }
        thead th:nth-child(2) { width: 10%; }
        thead th:nth-child(3) { width: 14%; }
        thead th:nth-child(4) { width: 27%; }
        thead th:nth-child(5) { width: 27%; }

        thead {
            background: linear-gradient(135deg, #1a3a5c, #2a6a8a, #3a7a9a);
            color: white;
        }

        thead th {
            padding: 16px 10px;
            text-align: center;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', 'Tahoma', sans-serif !important;
            position: relative;
        }

        thead th:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 20%;
            height: 60%;
            width: 1px;
            background: rgba(255, 255, 255, 0.15);
        }

        thead th:first-child {
            border-radius: 0 20px 0 0;
        }

        thead th:last-child {
            border-radius: 20px 0 0 0;
        }

        tbody tr {
            transition: all 0.3s ease;
        }

        tbody tr:last-child td:first-child {
            border-radius: 0 0 20px 0;
        }

        tbody tr:last-child td:last-child {
            border-radius: 0 0 0 20px;
        }

        tbody tr:nth-child(even) {
            background: #f0f6fc;
        }

        tbody tr:nth-child(odd) {
            background: #ffffff;
        }

        tbody tr:hover {
            background: linear-gradient(90deg, #dce8f5, #e8f0f8) !important;
            transform: scale(1.01);
            box-shadow: 0 4px 20px rgba(26, 58, 92, 0.08);
            cursor: default;
        }

        tbody td {
            padding: 13px 10px;
            text-align: center;
            font-weight: 500;
            color: #1a2a3a;
            font-size: 14px;
            font-family: 'Vazirmatn', 'Noto Kufi Arabic', 'Tahoma', sans-serif !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            position: relative;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody td:last-child {
            font-weight: 800;
            color: #0a7a3a;
            font-size: 16px;
            white-space: normal;
            word-break: break-word;
            background: linear-gradient(90deg, rgba(10, 122, 58, 0.04), rgba(10, 122, 58, 0.01));
        }

        tbody tr:hover td:last-child {
            background: linear-gradient(90deg, rgba(10, 122, 58, 0.08), rgba(10, 122, 58, 0.02));
        }

        tbody td:nth-last-child(2) {

            color: #7a4a1a;
            font-size: 14px;
            white-space: normal;
            word-break: break-word;
        }

        /* ===== تگ‌های کیفیت ===== */
        .grade-tag {

            font-weight: 800;

        .grade-1 {

        /* ===== مودال مدیریت ===== */
        .modal-overlay {

            padding: 20px;
        }

        .modal-overlay.active {

        @keyframes fadeIn {
            from {

            }
            to {
                opacity: 1;
            }
        }

        .modal-box {
            background: white;

        <!-- ===== دکمه محاسبه قیمت ===== -->
        <div class="calc-btn-wrapper">
            <button class="calc-btn" id="calcBtn">
                <span class="spinner"></span>
                <span class="btn-icon">🧮</span>

        <!-- ===== دکمه تنظیمات ===== -->
        <div class="settings-wrapper-middle">
            <button class="settings-btn" id="manageBtn">
                <span class="icon">⚙️</span>
                تنظیمات
            </button>

        <!-- ===== دو دکمه پایین ===== -->
        <div class="btn-group-bottom">
            <button class="share-btn" id="shareBtn" disabled>
                <span class="btn-text">📋 متن</span>
            </button>
            <button class="image-btn" id="imageBtn" disabled>
                <span class="spinner-small"></span>
                <span class="btn-text">🖼️ عکس</span>
            </button>
        </div>

        <!-- ===== نتایج ===== -->
        <div class="result-section" id="resultSection">
            <div class="result-header">
                <h2>لیست قیمت‌های فروش</h2>

                <button class="filter-btn" data-filter="معمولی">معمولی</button>

            <div id="capture-area">
                <div class="table-wrapper">
                    <table>

                            <tr>
                                <th>کیفیت</th>
                                <th>سایز</th>
                                <th>وزن (کیلو)</th>
                                <th>قیمت تمام شده</th>
                                <th>قیمت فروش</th>

                        </thead>

        <!-- ===== فوتر ===== -->

    <!-- ===== مودال مدیریت ===== -->
    <div class="modal-overlay" id="manageModal">
        <div class="modal-box">
            <button class="close-modal" id="closeManageModal">✕</button>
            <h2>مدیریت محصولات</h2>

            <div class="modal-product-list" id="productList">
                <!-- محصولات توسط JS ساخته می‌شوند -->
            </div>

            <div class="modal-add-row">
                <select id="newGrade">
                    <option value="قوی">قوی</option>
                    <option value="نیمه‌قوی">نیمه‌قوی</option>

                <input type="number" id="newSize" placeholder="سایز" value="50" min="10">
                <input type="number" id="newWeight" placeholder="وزن" value="3.0" step="0.1" min="0.1">

            </div>

    <!-- ===== مودال انتخاب خروجی ===== -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal-box">
            <button class="close-modal" id="closeExportModal">✕</button>
            <h2>انتخاب بخش‌های خروجی</h2>
            <p style="color:#4a6a7a;margin-bottom:12px;font-size:14px;">بخش‌هایی که می‌خواهید در خروجی نمایش داده شوند را انتخاب کنید:</p>

            <div class="export-options" id="exportOptions">
                <label>
                    <input type="checkbox" checked data-key="showPrices">
                    قیمت‌های پایه (هر کیلو)
                </label>
                <label>
                    <input type="checkbox" checked data-key="showProfit">
                    درصد سود
                </label>
                <label>
                    <input type="checkbox" checked data-key="showDate">
                    تاریخ محاسبه
                </label>
                <label>
                    <input type="checkbox" checked data-key="showCost">
                    ستون قیمت تمام شده
                </label>
                <label>
                    <input type="checkbox" checked data-key="showSell">
                    ستون قیمت فروش
                </label>
                <label>
                    <input type="checkbox" checked data-key="showHeader">
                    هدر جدول
                </label>
                <label>
                    <input type="checkbox" checked data-key="showFooter">
                    فوتر شرکت
                </label>
            </div>

            <div class="modal-actions">
                <button class="cancel-btn" id="cancelExportBtn">انصراف</button>
                <button class="save-btn" id="confirmExportBtn">✅ تایید و خروجی</button>
            </div>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast">متن کپی شد!</div>

    <script>
        // ============================================================
        //  داده‌های ثابت (قابل ویرایش)
        // ============================================================
        let PRODUCTS = [
            { grade: 'قوی', gradeClass: 'grade-1', size: 63, weight: 5.5 },
            { grade: 'قوی', gradeClass: 'grade-1', size: 90, weight: 7.3 },
            { grade: 'قوی', gradeClass: 'grade-1', size: 110, weight: 9.5 },
            { grade: 'قوی', gradeClass: 'grade-1', size: 125, weight: 12.2 },
            { grade: 'قوی', gradeClass: 'grade-1', size: 160, weight: 19.6 },
            { grade: 'قوی', gradeClass: 'grade-1', size: 200, weight: 28.5 },
            { grade: 'نیمه‌قوی', gradeClass: 'grade-2', size: 63, weight: 4.8 },
            { grade: 'نیمه‌قوی', gradeClass: 'grade-2', size: 90, weight: 6.5 },
            { grade: 'نیمه‌قوی', gradeClass: 'grade-2', size: 110, weight: 9.1 },
            { grade: 'نیمه‌قوی', gradeClass: 'grade-2', size: 125, weight: 11.8 },
            { grade: 'نیمه‌قوی', gradeClass: 'grade-2', size: 160, weight: 19.8 },
            { grade: 'نیمه‌قوی', gradeClass: 'grade-2', size: 200, weight: 28.8 },
            { grade: 'معمولی', gradeClass: 'grade-3', size: 63, weight: 3.5 },
            { grade: 'معمولی', gradeClass: 'grade-3', size: 90, weight: 4.4 },
            { grade: 'معمولی', gradeClass: 'grade-3', size: 110, weight: 6.4 },
            { grade: 'معمولی', gradeClass: 'grade-3', size: 125, weight: 8.2 }
        ];

        // ============================================================
        //  متغیرهای سراسری
        // ============================================================
        let lastPrices = {
            price1: 0,
            price2: 0,
            price3: 0,
            profit: 0,
            rows: [],
            date: ''
        };

        let currentFilter = 'all';
        let allRowsData = [];
        let isCalculating = false;
        let isCapturing = false;
        let exportAction = 'text';

        // ============================================================
        //  توابع کمکی
        // ============================================================
        function numberWithCommas(x) {
            return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function getCurrentDate() {
            const now = new Date();
            return now.toLocaleDateString('fa-IR') + ' ' + now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
        }

        function getDateForFilename() {
            const now = new Date();
            return now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                String(now.getDate()).padStart(2, '0');
        }

        function createRipple(event, button) {
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            const rect = button.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size / 2;
            const y = event.clientY - rect.top - size / 2;
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            button.appendChild(ripple);
            setTimeout(() => {
                ripple.remove();
            }, 700);
        }

        function getGradeClass(grade) {
            if (grade === 'قوی') return 'grade-1';
            if (grade === 'نیمه‌قوی') return 'grade-2';
            return 'grade-3';
        }

        // ============================================================
        //  توابع اصلی
        // ============================================================
        function calculate() {
            if (isCalculating) return;
            const btn = document.getElementById('calcBtn');

            isCalculating = true;
            btn.classList.add('loading');

            setTimeout(() => {
                performCalculation();
                btn.classList.remove('loading');
                isCalculating = false;
            }, 600);
        }

        function performCalculation() {
            const price1 = parseFloat(document.getElementById('price1').value);
            const price2 = parseFloat(document.getElementById('price2').value);
            const price3 = parseFloat(document.getElementById('price3').value);
            const profitPercent = parseFloat(document.getElementById('profit').value);

            if (isNaN(price1) || price1 < 0) { alert('لطفاً قیمت قوی را وارد کنید.'); return; }
            if (isNaN(price2) || price2 < 0) { alert('لطفاً قیمت نیمه‌قوی را وارد کنید.'); return; }
            if (isNaN(price3) || price3 < 0) { alert('لطفاً قیمت معمولی را وارد کنید.'); return; }
            if (isNaN(profitPercent) || profitPercent < 0) { alert('لطفاً درصد سود را وارد کنید.'); return; }

            const priceMap = {
                'قوی': price1,
                'نیمه‌قوی': price2,
                'معمولی': price3
            };

            const profitFactor = 1 + (profitPercent / 100);
            const tbody = document.getElementById('resultBody');
            const calcDate = document.getElementById('calcDate');

            const rowData = [];
            const date = getCurrentDate();

            PRODUCTS.forEach(p => {
                const costPerKg = priceMap[p.grade];
                if (costPerKg === undefined) return;

                const costPerUnit = p.weight * costPerKg;
                const finalPrice = costPerUnit * profitFactor;

                const roundedCost = Math.round(costPerUnit);
                const roundedFinal = Math.round(finalPrice);

                rowData.push({
                    grade: p.grade,
                    gradeClass: p.gradeClass,
                    size: p.size,
                    weight: p.weight,
                    costPrice: roundedCost,
                    sellPrice: roundedFinal
                });
            });

            allRowsData = rowData;
            lastPrices = {
                price1,
                price2,
                price3,
                profit: profitPercent,
                rows: rowData,
                date: date
            };

            applyFilter(currentFilter);

            calcDate.textContent = date;

            const section = document.getElementById('resultSection');
            section.classList.add('show');
            document.getElementById('shareBtn').disabled = false;
            document.getElementById('imageBtn').disabled = false;

            setTimeout(() => {
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 150);

            showToast('محاسبه با موفقیت انجام شد!');
        }

        function applyFilter(filter) {
            currentFilter = filter;
            const tbody = document.getElementById('resultBody');

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });

            let filteredRows = allRowsData;
            if (filter !== 'all') {
                filteredRows = allRowsData.filter(r => r.grade === filter);
            }

            let rows = '';
            filteredRows.forEach(r => {
                rows += `
                        <tr>
                            <td><span class="grade-tag ${r.gradeClass}">${r.grade}</span></td>
                            <td>${r.size}</td>
                            <td>${r.weight.toFixed(1)}</td>
                            <td>${numberWithCommas(r.costPrice)}</td>
                            <td>${numberWithCommas(r.sellPrice)}</td>
                        </tr>
                    `;
            });

            tbody.innerHTML = rows || '<tr><td colspan="5" style="padding:20px;color:#7a8a9a;">هیچ محصولی یافت نشد</td></tr>';
        }

        // ============================================================
        //  توابع خروجی با انتخاب بخش‌ها
        // ============================================================
        function getExportOptions() {
            const checkboxes = document.querySelectorAll('#exportOptions input[type="checkbox"]');
            const options = {};
            checkboxes.forEach(cb => {
                options[cb.dataset.key] = cb.checked;
            });
            return options;
        }

        function showExportModal(action) {
            if (allRowsData.length === 0) {
                alert('لطفاً ابتدا محاسبه را انجام دهید.');
                return;
            }
            exportAction = action;
            document.getElementById('exportModal').classList.add('active');
        }

        function closeExportModal() {
            document.getElementById('exportModal').classList.remove('active');
        }

        function generateFilteredText(options) {
            const p = lastPrices;
            if (p.rows.length === 0) return '';

            let text = '';
            text += 'لیست قیمت فروش لوله UPVC\n';
            text += '═══════════════════════════════\n';

            if (options.showDate) {
                text += `${p.date}\n`;
            }

            if (options.showPrices) {
                text += `قیمت هر کیلو قوی: ${numberWithCommas(p.price1)} تومان\n`;
                text += `قیمت هر کیلو نیمه‌قوی: ${numberWithCommas(p.price2)} تومان\n`;
                text += `قیمت هر کیلو معمولی: ${numberWithCommas(p.price3)} تومان\n`;
            }

            if (options.showProfit) {
                text += `درصد سود: ${p.profit}٪\n`;
            }

            text += '═══════════════════════════════\n\n';

            let header = '┌──────────┬────────';
            if (options.showCost) header += '┬────────────';
            if (options.showSell) header += '┬────────────';
            header += '┐\n';

            let headerRow = '│  کیفیت   │  سایز  ';
            if (options.showCost) headerRow += '│ تمام شده  ';
            if (options.showSell) headerRow += '│ قیمت فروش ';
            headerRow += '│\n';

            let separator = '├──────────┼────────';
            if (options.showCost) separator += '┼────────────';
            if (options.showSell) separator += '┼────────────';
            separator += '┤\n';

            text += header + headerRow + separator;

            p.rows.forEach(r => {
                let row = `│ ${r.grade.padEnd(8)} │ ${String(r.size).padEnd(6)} `;
                if (options.showCost) {
                    row += `│ ${String(numberWithCommas(r.costPrice)).padEnd(10)} `;
                }
                if (options.showSell) {
                    row += `│ ${String(numberWithCommas(r.sellPrice)).padEnd(10)} `;
                }
                row += '│\n';
                text += row;
            });

            let footer = '└──────────┴────────';
            if (options.showCost) footer += '┴────────────';
            if (options.showSell) footer += '┴────────────';
            footer += '┘\n';

            text += footer;
            text += '═══════════════════════════════\n';

            if (options.showFooter) {
                text += 'شرکت هگمتان پلاستیک الوند';
            }

            return text;
        }

        function shareResult() {
            showExportModal('text');
        }

        function doShareText() {
            const options = getExportOptions();
            const text = generateFilteredText(options);

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('متن در کلیپ‌بورد کپی شد!');
                }).catch(() => {
                    copyFallback(text);
                });
            } else {
                copyFallback(text);
            }

            if (navigator.share) {
                navigator.share({
                    title: 'لیست قیمت لوله UPVC',
                    text: text
                }).catch(() => {});
            }

            closeExportModal();
        }

        function copyFallback(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('متن در کلیپ‌بورد کپی شد!');
            } catch (err) {
                alert('لطفاً متن زیر را کپی کنید:\n\n' + text);
            }
            document.body.removeChild(textarea);
        }

        // ============================================================
        //  خروجی عکس با فرمت JPEG (رفع مشکلات فونت و پوشش کامل)
        // ============================================================
        function captureAsImage() {
            showExportModal('image');
        }

        function doCaptureImage() {
            const options = getExportOptions();
            const btn = document.getElementById('imageBtn');
            isCapturing = true;
            btn.classList.add('loading');
            closeExportModal();

            const captureArea = document.getElementById('capture-area');
            const tableWrapper = captureArea.querySelector('.table-wrapper');
            const tableHead = document.getElementById('tableHead');
            const resultHeader = document.querySelector('.result-header');
            const calcDate = document.querySelector('.calc-date');
            const settingsWrapper = document.querySelector('.settings-wrapper-middle');

            // ذخیره وضعیت فعلی
            const originalStates = {
                header: tableHead.style.display,
                resultHeader: resultHeader.style.display,
                calcDate: calcDate.style.display,
                settingsWrapper: settingsWrapper.style.display,
                captureAreaOverflow: captureArea.style.overflow,
                tableWrapperOverflow: tableWrapper ? tableWrapper.style.overflow : '',
                tableWrapperWidth: tableWrapper ? tableWrapper.style.width : '',
                thDisplay: [],
                tdDisplay: []
            };

            const allTh = tableHead.querySelectorAll('th');
            allTh.forEach((th, idx) => {
                originalStates.thDisplay[idx] = th.style.display;
            });

            const allRows = captureArea.querySelectorAll('tbody tr');
            allRows.forEach(row => {
                const cells = row.querySelectorAll('td');
                cells.forEach((td, idx) => {
                    if (!originalStates.tdDisplay[idx]) {
                        originalStates.tdDisplay[idx] = [];
                    }
                    originalStates.tdDisplay[idx][row.rowIndex] = td.style.display;
                });
            });

            // اعمال تنظیمات
            tableHead.style.display = options.showHeader ? '' : 'none';
            resultHeader.style.display = (options.showPrices || options.showProfit || options.showDate) ? '' : 'none';
            calcDate.style.display = options.showDate ? '' : 'none';
            settingsWrapper.style.display = 'none';

            const hideCols = [];
            if (!options.showCost) hideCols.push(3);
            if (!options.showSell) hideCols.push(4);

            allTh.forEach((th, idx) => {
                th.style.display = hideCols.includes(idx) ? 'none' : '';
            });

            allRows.forEach(row => {
                const cells = row.querySelectorAll('td');
                cells.forEach((td, idx) => {
                    td.style.display = hideCols.includes(idx) ? 'none' : '';
                });
            });

            if (!options.showCost && !options.showSell) {
                allTh.forEach((th, idx) => {
                    if (idx === 2) th.style.display = 'none';
                });
                allRows.forEach(row => {
                    const cells = row.querySelectorAll('td');
                    cells.forEach((td, idx) => {
                        if (idx === 2) td.style.display = 'none';
                    });
                });
            }

            // اضافه کردن سربرگ (عنوان + تاریخ) به‌عنوان یک عنصر داخل ناحیه عکس
            // نکته: .result-header بیرون از #capture-area قرار داره، برای همین
            // هیچ‌وقت توی عکس دیده نمی‌شد؛ اینجا یک نسخه‌ی مشابه، داخل خودِ
            // capture-area می‌سازیم تا واقعاً در خروجی ظاهر بشه.
            let dateHeaderElement = null;
            if (options.showDate) {
                dateHeaderElement = document.createElement('div');
                dateHeaderElement.style.textAlign = 'center';
                dateHeaderElement.style.padding = '0 0 14px 0';
                dateHeaderElement.style.fontSize = '13px';
                dateHeaderElement.style.fontWeight = '700';
                dateHeaderElement.style.color = '#3a6a8a';
                dateHeaderElement.style.fontFamily = "'Vazirmatn', 'Noto Kufi Arabic', 'Tahoma', sans-serif";
                dateHeaderElement.textContent = 'تاریخ محاسبه: ' + getCurrentDate();
                captureArea.insertBefore(dateHeaderElement, captureArea.firstChild);
            }

            // اضافه کردن فوتر به عنوان یک عنصر جداگانه در ناحیه عکس
            let footerElement = null;
            if (options.showFooter) {
                footerElement = document.createElement('div');
                footerElement.style.textAlign = 'center';
                footerElement.style.padding = '16px 0 4px 0';
                footerElement.style.fontSize = '15px';
                footerElement.style.fontWeight = '800';
                footerElement.style.color = '#1a3a5c';
                footerElement.style.fontFamily = "'Vazirmatn', 'Noto Kufi Arabic', 'Tahoma', sans-serif";
                footerElement.style.borderTop = '2px solid #e8eef4';
                footerElement.style.marginTop = '8px';
                footerElement.textContent = 'شرکت هگمتان پلاستیک الوند';
                captureArea.appendChild(footerElement);
            }

            // اطمینان از اینکه capture-area عرض کامل رو پوشش میده
            captureArea.style.width = '100%';
            captureArea.style.display = 'block';

            // رفع کلیدی: overflow:hidden روی capture-area و overflow-x:auto روی
            // table-wrapper باعث می‌شد جدولی که عریض‌تر از کادره، در عکس بریده بشه.
            // اینجا موقتاً بازشون می‌کنیم تا هیچ محتوایی از قاب بیرون/بریده نیفته.
            // نکته: دیگه لازم نیست عرض wrapper رو به‌صورت اجباری max-content کنیم؛
            // چون جدول الان table-layout:fixed و width:100% داره و همیشه دقیقاً
            // داخل عرض کادر جا می‌شه. تنظیم max-content روی wrapperـی که فرزندش
            // width:100% داره باعث یک وابستگی دوری در محاسبه‌ی عرض می‌شد که
            // نتیجه‌ش جمع‌شدن کل جدول به ارتفاع تقریباً صفر (و عکس خروجی خراب) بود.
            captureArea.style.overflow = 'visible';
            if (tableWrapper) {
                tableWrapper.style.overflow = 'visible';
            }

            const startCapture = () => {
                const fullWidth = captureArea.scrollWidth;
                const fullHeight = captureArea.scrollHeight;
                // نکته مهم: windowWidth تعیین می‌کنه که CSS media query ها با چه
                // عرضی محاسبه بشن. اگه اینو برابر با عرض کامل (باز شدهٔ) جدول
                // بذاریم که ممکنه از ۵۰۰px بیشتر باشه، html2canvas وارد حالت
                // "دسکتاپ" می‌شه و پدینگ/فونت‌های بزرگ‌تر رو اعمال می‌کنه که باعث
                // فاصلهٔ اضافه و عکس کشیده/نامتناسب می‌شه. اینجا windowWidth رو
                // دقیقاً برابر با عرض واقعی صفحهٔ کاربر نگه می‌داریم تا media
                // query دقیقاً همون چیزی باشه که خودِ کاربر می‌بینه.
                const deviceWidth = document.documentElement.clientWidth;

                // محدود کردن مقیاس (scale) بر اساس ابعاد واقعی جدول
                // نکته مهم: قبلاً فقط «مساحت کل» تصویر رو محدود می‌کردیم، ولی وقتی
                // جدول ردیف‌های زیادی داره (باریک ولی خیلی بلند)، ارتفاعش به‌تنهایی
                // می‌تونه از حداکثر ابعاد مجازِ canvas در مرورگرها (مخصوصاً سافاری
                // آیفون که معمولاً هر ضلع canvas رو به چند هزار پیکسل محدود می‌کنه)
                // بیشتر بشه؛ در این حالت مرورگر یک canvas خالی/خراب برمی‌گردونه و
                // toBlob/toDataURL هم داده‌ی خالی می‌دن. اینجا هم عرض، هم ارتفاع و
                // هم مساحت کل رو جداگانه محدود می‌کنیم.
                const MAX_DIMENSION = 4000; // سقف امن برای هر ضلع (عرض/ارتفاع) canvas
                const MAX_CANVAS_PIXELS = 16000000; // ~16 مگاپیکسل، سقف امن مساحت کل
                const safeWidth = Math.max(1, fullWidth);
                const safeHeight = Math.max(1, fullHeight);
                let scale = 2.5;
                scale = Math.min(scale, MAX_DIMENSION / safeWidth);
                scale = Math.min(scale, MAX_DIMENSION / safeHeight);
                scale = Math.min(scale, Math.sqrt(MAX_CANVAS_PIXELS / (safeWidth * safeHeight)));
                // اگه جدول واقعاً خیلی خیلی بزرگه که حتی scale کمتر از ۱ هم لازمه،
                // اجازه می‌دیم (تصویر کوچیک‌تر ولی سالم بهتر از فایل خراب/خالیه)
                if (!isFinite(scale) || scale <= 0) scale = 1;

                html2canvas(captureArea, {
                    scale: scale,
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    logging: false,
                    width: fullWidth,
                    height: fullHeight,
                    windowWidth: deviceWidth,
                    windowHeight: fullHeight,
                    onclone: async function(clonedDoc, element) {
                        // چون windowWidth رو عمداً باریک (هم‌اندازه گوشی) نگه داشتیم تا
                        // media query درست اجرا بشه، اگه جدول از این عرض بیشتر باشه
                        // نباید توسط overflow-x:hidden بدنه‌ی صفحه بریده بشه
                        if (clonedDoc.body) {
                            clonedDoc.body.style.overflowX = 'visible';
                            clonedDoc.body.style.overflow = 'visible';
                        }

                        // تنظیم فونت برای تمام عناصر کلون شده با اولویت بالا
                        const FONT_STACK = "'Vazirmatn', 'Noto Kufi Arabic', 'Tahoma', sans-serif";
                        const allEls = element.querySelectorAll('*');
                        allEls.forEach(el => {
                            el.style.setProperty('font-family', FONT_STACK, 'important');
                            el.style.fontWeight = '500';
                            // نکته حیاتی: letter-spacing باعث می‌شه html2canvas هر حرف رو
                            // جدا رسم کنه و اتصال حروف فارسی/عربی بهم بریزه (دقیقاً همون
                            // مشکل حروف جدا از هم و روی‌هم‌افتاده در عکس خروجی)
                            el.style.setProperty('letter-spacing', 'normal', 'important');
                        });

                        // تنظیم فونت برای تگ‌های کیفیت
                        const gradeTags = element.querySelectorAll('.grade-tag');
                        gradeTags.forEach(el => {
                            el.style.setProperty('font-family', FONT_STACK, 'important');
                            el.style.fontWeight = '800';
                        });

                        // تنظیم فونت برای هدر جدول
                        const thEls = element.querySelectorAll('th');
                        thEls.forEach(el => {
                            el.style.setProperty('font-family', FONT_STACK, 'important');
                            el.style.fontWeight = '800';
                        });

                        // تنظیم فونت برای سلول‌های جدول
                        const tdEls = element.querySelectorAll('td');
                        tdEls.forEach(el => {
                            el.style.setProperty('font-family', FONT_STACK, 'important');
                            el.style.fontWeight = '500';
                        });

                        // تنظیم فونت برای کل جدول
                        const tables = element.querySelectorAll('table');
                        tables.forEach(el => {
                            el.style.setProperty('font-family', FONT_STACK, 'important');
                        });

                        // اطمینان از راست‌چین بودن و پوشش کامل + باز نگه داشتن قاب در نسخه کلون‌شده
                        const container = element.querySelector('#capture-area');
                        if (container) {
                            container.style.direction = 'rtl';
                            container.style.setProperty('font-family', FONT_STACK, 'important');
                            container.style.width = '100%';
                            container.style.overflow = 'visible';
                            container.style.display = 'block';
                            container.style.padding = '20px';
                            container.style.background = '#ffffff';
                        }

                        // اطمینان از پوشش کامل جدول (بدون برگردوندن overflow/width به حالت قبل)
                        const wrapper = element.querySelector('.table-wrapper');
                        if (wrapper) {
                            wrapper.style.overflow = 'visible';
                            wrapper.style.display = 'block';
                        }

                        const table = element.querySelector('table');
                        if (table) {
                            table.style.display = 'table';
                        }

                        // ===== نکته اصلی رفع بهم‌ریختگی فونت =====
                        // html2canvas این DOM کلون‌شده رو داخل یک iframe جدا رندر می‌کنه که
                        // فونت‌های خودش رو جدا از صفحه اصلی لود می‌کنه. صبر کردن روی
                        // document.fonts.ready در صفحه‌ی اصلی کافی نیست؛ باید صبر کنیم تا
                        // فونت‌ها داخل همین سند کلون‌شده هم واقعاً لود بشن، وگرنه html2canvas
                        // قبل از لود کامل فونت وازیرمتن، عکس رو با فونت جایگزین می‌گیره.
                        if (clonedDoc.fonts && clonedDoc.fonts.ready) {
                            try {
                                await Promise.race([
                                    clonedDoc.fonts.ready,
                                    new Promise(resolve => setTimeout(resolve, 3000))
                                ]);
                            } catch (e) {}
                        }
                    }
                }).then(canvas => {
                    // حذف فوتر و سربرگ تاریخ اضافه شده
                    if (footerElement && footerElement.parentNode) {
                        footerElement.parentNode.removeChild(footerElement);
                    }
                    if (dateHeaderElement && dateHeaderElement.parentNode) {
                        dateHeaderElement.parentNode.removeChild(dateHeaderElement);
                    }

                    // بازیابی وضعیت
                    tableHead.style.display = originalStates.header;
                    resultHeader.style.display = originalStates.resultHeader;
                    calcDate.style.display = originalStates.calcDate;
                    settingsWrapper.style.display = originalStates.settingsWrapper;
                    captureArea.style.overflow = originalStates.captureAreaOverflow;
                    if (tableWrapper) {
                        tableWrapper.style.overflow = originalStates.tableWrapperOverflow;
                        tableWrapper.style.width = originalStates.tableWrapperWidth;
                        tableWrapper.style.maxWidth = '';
                    }

                    allTh.forEach((th, idx) => {
                        th.style.display = originalStates.thDisplay[idx] || '';
                    });

                    allRows.forEach(row => {
                        const cells = row.querySelectorAll('td');
                        cells.forEach((td, idx) => {
                            td.style.display = (originalStates.tdDisplay[idx] && originalStates.tdDisplay[idx][row
                                .rowIndex]) || '';
                        });
                    });

                    btn.classList.remove('loading');
                    isCapturing = false;

                    // تبدیل به Blob (به‌جای data URL) و دانلود/اشتراک‌گذاری مطمئن
                    // نکته: استفاده از canvas.toDataURL برای عکس‌های بزرگ و همچنین
                    // کلیک کردن لینک دانلود بدون اضافه کردنش به صفحه، در برخی
                    // مرورگرهای موبایل (خصوصاً سافاری آیفون و مرورگرهای داخل اپ)
                    // باعث می‌شد فایل خروجی باز نشه یا اصلاً دانلود نشه.
                    // نکته مهم‌تر: اگه canvas به هر دلیلی "آلوده" (tainted) بشه
                    // (مثلاً به‌خاطر allowTaint)، مرورگر اجازه نمی‌ده اصلاً ازش
                    // عکس خروجی گرفته بشه و فایلی که ساخته می‌شه خراب/غیرقابل‌بازه؛
                    // برای همین allowTaint حذف شد و اینجا هم خطای احتمالی رو
                    // به‌صورت شفاف به کاربر نشون می‌دیم.
                    if (!canvas || canvas.width === 0 || canvas.height === 0) {
                        showToast('خطا: تصویر ساخته‌شده خالی است (ابعاد ' +
                            (canvas ? canvas.width + '×' + canvas.height : 'نامشخص') + ')');
                        return;
                    }

                    try {
                        canvas.toBlob(function(blob) {
                            if (!blob || blob.size === 0) {
                                // بازگشت به روش toDataURL به‌عنوان جایگزین؛ در برخی
                                // مرورگرها/وب‌ویوهای موبایل toBlob پشتیبانی درست نمی‌شه
                                // ولی toDataURL جواب می‌ده
                                fallbackToDataUrl();
                                return;
                            }

                            const fileName = `لیست_قیمت_UPVC_${getDateForFilename()}.jpg`;
                            const file = new File([blob], fileName, { type: 'image/jpeg' });

                            const downloadBlob = () => {
                                const url = URL.createObjectURL(blob);
                                const link = document.createElement('a');
                                link.href = url;
                                link.download = fileName;
                                // نکته کلیدی: لینک باید داخل صفحه باشه تا کلیک روش
                                // در همه مرورگرها (خصوصاً موبایل) واقعاً اجرا بشه
                                document.body.appendChild(link);
                                link.click();
                                document.body.removeChild(link);
                                setTimeout(() => URL.revokeObjectURL(url), 2000);
                                showToast('عکس با فرمت JPEG ذخیره شد!');
                            };

                            // در موبایل، اشتراک‌گذاری بومی (Share Sheet) قابل‌اعتمادتر از
                            // دانلود مستقیمه؛ اگه پشتیبانی نشه یا کاربر لغو کنه، به حالت
                            // دانلود معمولی برمی‌گردیم
                            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                                navigator.share({
                                    title: 'لیست قیمت لوله UPVC',
                                    files: [file]
                                }).then(() => {
                                    showToast('عکس با موفقیت ارسال شد!');
                                }).catch((err) => {
                                    if (err && err.name === 'AbortError') return;
                                    downloadBlob();
                                });
                            } else {
                                downloadBlob();
                            }
                        }, 'image/jpeg', 0.95);
                    } catch (blobError) {
                        console.error('خطا در toBlob:', blobError);
                        fallbackToDataUrl(blobError);
                    }

                    // مسیر جایگزین: تبدیل مستقیم canvas به data URL و دانلود از
                    // همون طریق. فقط زمانی اجرا می‌شه که toBlob شکست بخوره
                    function fallbackToDataUrl(originalError) {
                        try {
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
                            if (!dataUrl || dataUrl.length < 100) {
                                throw new Error('داده تصویر خالی برگشت');
                            }
                            const fileName = `لیست_قیمت_UPVC_${getDateForFilename()}.jpg`;
                            const link = document.createElement('a');
                            link.href = dataUrl;
                            link.download = fileName;
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            showToast('عکس با فرمت JPEG ذخیره شد!');
                        } catch (dataUrlError) {
                            console.error('خطا در toDataURL:', dataUrlError);
                            const msg = (dataUrlError && dataUrlError.message) ||
                                (originalError && originalError.message) || 'نامشخص';
                            showToast('خطا در ساخت تصویر: ' + msg + ' (ابعاد ' + canvas.width + '×' + canvas.height + ')');
                        }
                    }


                }).catch(error => {
                    console.error('خطا در تبدیل به عکس:', error);
                    // حذف فوتر و سربرگ تاریخ اضافه شده در صورت خطا
                    if (footerElement && footerElement.parentNode) {
                        footerElement.parentNode.removeChild(footerElement);
                    }
                    if (dateHeaderElement && dateHeaderElement.parentNode) {
                        dateHeaderElement.parentNode.removeChild(dateHeaderElement);
                    }
                    // بازیابی وضعیت
                    tableHead.style.display = originalStates.header;
                    resultHeader.style.display = originalStates.resultHeader;
                    calcDate.style.display = originalStates.calcDate;
                    settingsWrapper.style.display = originalStates.settingsWrapper;
                    captureArea.style.overflow = originalStates.captureAreaOverflow;
                    if (tableWrapper) {
                        tableWrapper.style.overflow = originalStates.tableWrapperOverflow;
                        tableWrapper.style.width = originalStates.tableWrapperWidth;
                        tableWrapper.style.maxWidth = '';
                    }

                    allTh.forEach((th, idx) => {
                        th.style.display = originalStates.thDisplay[idx] || '';
                    });

                    allRows.forEach(row => {
                        const cells = row.querySelectorAll('td');
                        cells.forEach((td, idx) => {
                            td.style.display = (originalStates.tdDisplay[idx] && originalStates.tdDisplay[idx][row
                                .rowIndex]) || '';
                        });
                    });

                    btn.classList.remove('loading');
                    isCapturing = false;
                    showToast('خطا در تبدیل به عکس');
                });
            };

            // اطمینان از لود کامل فونت‌ها در صفحه اصلی + فرصت برای اعمال layout جدید
            // (باز شدن overflow) قبل از شروع عکس‌گیری
            const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
            Promise.race([
                fontsReady,
                new Promise(resolve => setTimeout(resolve, 2000))
            ]).then(() => {
                setTimeout(startCapture, 150);
            });
        }

        // ============================================================
        //  مدیریت محصولات
        // ============================================================
        function openManageModal() {
            document.getElementById('manageModal').classList.add('active');
            renderProductList();
        }

        function closeManageModal() {
            document.getElementById('manageModal').classList.remove('active');
        }

        function renderProductList() {
            const container = document.getElementById('productList');
            let html = '';
            PRODUCTS.forEach((p, index) => {
                const gradeClass = getGradeClass(p.grade);
                html += `
                        <div class="modal-product-item" data-index="${index}">
                            <span class="grade-badge ${gradeClass}">${p.grade}</span>
                            <span class="size-display">سایز ${p.size}</span>
                            <input type="number" class="weight-input" value="${p.weight}" step="0.1" min="0.1" data-index="${index}">
                            <button class="delete-btn" data-index="${index}">✕</button>
                        </div>
                    `;
            });
            container.innerHTML = html || '<p style="padding:20px;text-align:center;color:#7a8a9a;">هیچ محصولی ثبت نشده است.</p>';

            container.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    if (confirm('آیا از حذف این محصول مطمئن هستید؟')) {
                        PRODUCTS.splice(idx, 1);
                        renderProductList();
                    }
                });
            });

            container.querySelectorAll('.weight-input').forEach(input => {
                input.addEventListener('change', function() {
                    const idx = parseInt(this.dataset.index);
                    const val = parseFloat(this.value);
                    if (!isNaN(val) && val > 0) {
                        PRODUCTS[idx].weight = val;
                    } else {
                        this.value = PRODUCTS[idx].weight;
                    }
                });
            });
        }

        function addNewProduct() {
            const grade = document.getElementById('newGrade').value;
            const size = parseInt(document.getElementById('newSize').value);
            const weight = parseFloat(document.getElementById('newWeight').value);

            if (isNaN(size) || size < 1) { alert('سایز معتبر وارد کنید.'); return; }
            if (isNaN(weight) || weight < 0.1) { alert('وزن معتبر وارد کنید.'); return; }

            const exists = PRODUCTS.some(p => p.grade === grade && p.size === size);
            if (exists) {
                alert('این سایز برای این کیفیت قبلاً ثبت شده است.');
                return;
            }

            PRODUCTS.push({
                grade: grade,
                gradeClass: getGradeClass(grade),
                size: size,
                weight: weight
            });

            const gradeOrder = { 'قوی': 1, 'نیمه‌قوی': 2, 'معمولی': 3 };
            PRODUCTS.sort((a, b) => {
                if (gradeOrder[a.grade] !== gradeOrder[b.grade]) {
                    return gradeOrder[a.grade] - gradeOrder[b.grade];
                }
                return a.size - b.size;
            });

            renderProductList();
            document.getElementById('newSize').value = '';
            document.getElementById('newWeight').value = '';
            showToast('محصول جدید اضافه شد!');
        }

        function saveProducts() {
            closeManageModal();
            if (allRowsData.length > 0) {
                performCalculation();
                showToast('تغییرات ذخیره و محاسبه مجدد انجام شد!');
            } else {
                showToast('تغییرات ذخیره شد!');
            }
        }

        // ============================================================
        //  رویدادها
        // ============================================================
        document.querySelectorAll('.calc-btn, .btn-group-bottom button, .settings-btn, .filter-btn, .modal-actions button, .modal-add-row .add-btn, .delete-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                createRipple(e, this);
            });
        });

        document.getElementById('calcBtn').addEventListener('click', calculate);
        document.getElementById('shareBtn').addEventListener('click', shareResult);
        document.getElementById('imageBtn').addEventListener('click', captureAsImage);

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                if (allRowsData.length > 0) {
                    applyFilter(this.dataset.filter);
                }
            });
        });

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    calculate();
                }
            });
        });

        document.getElementById('manageBtn').addEventListener('click', openManageModal);
        document.getElementById('closeManageModal').addEventListener('click', closeManageModal);
        document.getElementById('cancelManageBtn').addEventListener('click', closeManageModal);
        document.getElementById('saveManageBtn').addEventListener('click', saveProducts);
        document.getElementById('addProductBtn').addEventListener('click', addNewProduct);

        document.getElementById('closeExportModal').addEventListener('click', closeExportModal);
        document.getElementById('cancelExportBtn').addEventListener('click', closeExportModal);
        document.getElementById('confirmExportBtn').addEventListener('click', function() {
            if (exportAction === 'text') {
                doShareText();
            } else {
                doCaptureImage();
            }
        });

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });
        });

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(calculate, 400);
        });
    </script>

</body>
</html>
